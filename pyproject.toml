[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-platform"
version = "0.1.0"
description = "Agent governance platform with auditable runs, policy, budget, HITL, sandbox, and multi-agent coordination."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
agentgov = "agentgov.cli:app"

[project.optional-dependencies]
artifacts = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "python-docx>=1.1",
  "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
